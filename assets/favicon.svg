<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- VR Headset shape -->
  <rect x="6" y="20" width="52" height="28" rx="8" fill="url(#grad)"/>
  <!-- Left lens -->
  <circle cx="22" cy="34" r="9" fill="#0a0e1a"/>
  <circle cx="22" cy="34" r="6" fill="#1a1a2e"/>
  <circle cx="20" cy="32" r="2" fill="#fff" opacity="0.8"/>
  <!-- Right lens -->
  <circle cx="42" cy="34" r="9" fill="#0a0e1a"/>
  <circle cx="42" cy="34" r="6" fill="#1a1a2e"/>
  <circle cx="40" cy="32" r="2" fill="#fff" opacity="0.8"/>
  <!-- Top light -->
  <rect x="28" y="23" width="8" height="3" rx="1.5" fill="#fff" opacity="0.6"/>
  <!-- Straps -->
  <rect x="0" y="30" width="8" height="8" rx="2" fill="url(#grad)" opacity="0.7"/>
  <rect x="56" y="30" width="8" height="8" rx="2" fill="url(#grad)" opacity="0.7"/>
</svg>
