<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#14121f" />
  <title>View in VR | Rabiat Sadiq</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="assets/style.css" />
  <script>
    (function () {
      var plain = localStorage.getItem('plainMode') === 'true';
      if (plain) return;
      var saved = localStorage.getItem('theme');
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) {
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
      }
    })();
  </script>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #151416;
      color: #f1f5f9;
    }
    .vr-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      background: linear-gradient(160deg, rgba(20, 18, 31, 0.92), rgba(10, 14, 26, 0.88));
      pointer-events: none;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .vr-overlay.is-hidden {
      opacity: 0;
      visibility: hidden;
    }
    .vr-overlay__panel {
      pointer-events: auto;
      text-align: center;
      max-width: 420px;
    }
    .vr-overlay h1 {
      font-size: clamp(22px, 4vw, 28px);
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff, #e0e7ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .vr-overlay p {
      font-size: 15px;
      line-height: 1.5;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .vr-overlay__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .vr-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .vr-btn--primary {
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      color: #fff;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.45);
    }
    .vr-btn--primary:hover { transform: translateY(-2px); }
    .vr-btn--secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .vr-btn--secondary:hover { background: rgba(255, 255, 255, 0.14); }
    .vr-btn[hidden] { display: none !important; }
    .vr-hint {
      font-size: 12px;
      color: #64748b;
      margin-top: 8px;
    }
    a-scene { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="vrOverlay" class="vr-overlay" role="dialog" aria-labelledby="vrOverlayTitle">
    <div class="vr-overlay__panel">
      <h1 id="vrOverlayTitle">Step inside the site</h1>
      <p id="vrOverlayDesc">Enter the portfolio hero in immersive VR. Use your hands (Quest hand tracking), controllers, or mouse — point, pinch, or grab project cards to interact.</p>
      <div class="vr-overlay__actions">
        <button type="button" class="vr-btn vr-btn--primary" id="enterVrBtn">Enter VR</button>
        <a href="index.html" class="vr-btn vr-btn--secondary">Back to 2D site</a>
      </div>
      <p class="vr-hint" id="vrOverlayHint">Requires a VR headset browser over HTTPS</p>
    </div>
  </div>

  <a-scene
    id="vrScene"
    embedded
    renderer="antialias: true; colorManagement: true; physicallyCorrectLights: false; alpha: false; precision: mediump"
    webxr="requiredFeatures: local-floor; optionalFeatures: bounded-floor, hand-tracking"
    vr-mode-ui="enabled: true"
    loading-screen="dotsColor: #7c3aed; backgroundColor: #151416"
    background="color: #151416"
  >
    <a-assets id="vrAssets" timeout="120000">
      <a-asset-item id="vrFont" src="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-asset-item>
    </a-assets>

    <a-light type="ambient" color="#c4b5fd" intensity="0.55"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.35" position="2 4 3"></a-light>
    <a-light type="directional" color="#f9a8d4" intensity="0.2" position="-2 2 -2"></a-light>

    <a-entity id="vrAtmosphere"></a-entity>
    <a-entity id="vrHero"></a-entity>
    <a-entity id="vrGallery"></a-entity>
    <a-entity id="vrNav"></a-entity>

    <a-entity id="rig" position="0 0 0">
      <a-camera
        id="camera"
        look-controls="pointerLockEnabled: false"
        wasd-controls="enabled: false"
        position="0 1.6 0"
        cursor="fuse: false; rayOrigin: mouse"
        raycaster="objects: .clickable; far: 12"
      ></a-camera>
    </a-entity>

    <a-entity id="leftHand"></a-entity>
    <a-entity id="rightHand"></a-entity>
  </a-scene>

  <script src="assets/vr-lobby.js"></script>
</body>
</html>
