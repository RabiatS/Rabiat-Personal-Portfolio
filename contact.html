  <!-- Prevent theme flash & minimalist Rabiat -->
  <script>
    (function(){
      var g = localStorage.getItem('glassLevel');
      var legacy = { clear: 0, 'default': 50, frosted: 100 };
      var t = (g in legacy ? legacy[g] : parseInt(g, 10));
      if (!isFinite(t)) t = 50;
      t = Math.min(100, Math.max(0, t)) / 100;
      var st = document.documentElement.style;
      st.setProperty('--glass-blur', (1.6 + t * 38).toFixed(2) + 'px');
      st.setProperty('--glass-saturate', (1.05 + t * 1.05).toFixed(3));
      st.setProperty('--glass-alpha-boost', (-0.055 + t * 0.2).toFixed(4));
      st.setProperty('--glass-lens', (1 - t).toFixed(3));
      var plain = localStorage.getItem('plainMode') === 'true';
      var rabiat = localStorage.getItem('plainModeVariant') === 'rabiat';
      if (plain && rabiat) {
        document.documentElement.classList.add('plain-mode', 'plain-mode--rabiat', 'dark');
        document.documentElement.style.colorScheme = 'dark';
        return;
      }
      if (plain) {
        document.documentElement.classList.add('plain-mode');
        document.documentElement.style.colorScheme = 'light';
        return;
      }
      var saved = localStorage.getItem('theme');
      var dark = saved ? (saved === 'dark') : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) { document.documentElement.classList.add('dark'); document.documentElement.style.colorScheme='dark'; }
    })();
  </script>

  <main class="container" style="padding-top:120px;padding-bottom:80px;min-height:calc(100vh - 200px);">
    <section style="text-align:center;margin-bottom:48px;">
      <h1>Let's Connect</h1>
      <p class="lead" style="margin:16px auto 0;max-width:600px;">Whether you want to collaborate, learn more about my work, or just say hi. I would love to hear from you!</p>
    </section>

    <section class="card" style="max-width:720px;margin:0 auto">
      <form id="contactForm" class="contact-form" action="#" method="GET">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" required placeholder="Your name" autocomplete="name">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="_replyto" type="email" required placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field field--full">
          <label for="subject">Subject</label>
          <input id="subject" name="subject" required placeholder="Collaboration / Question / Just saying hi">
        </div>
        <div class="field field--full">
          <label for="message">Message</label>
          <textarea id="message" name="message" required rows="6" placeholder="What's on your mind?"></textarea>
        </div>

        <!-- Honeypot -->
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" class="honeypot">

        <div class="field--full contact-actions">
          <button class="btn" type="submit">Send</button>
          <!-- "Email instead" used to open the same mailto: as Send, just empty.
               Copying the address is the genuinely different option. -->
          <button class="btn secondary" type="button" id="copyEmail"
                  data-email="robbiahsadiq@gmail.com">Copy my email</button>
          <a class="btn secondary contact-joke" href="https://www.youtube.com/watch?v=xvFZjo5PgG0" target="_blank" rel="noopener">🎁 Don't click</a>
          <span id="formStatus" class="muted" aria-live="polite"></span>
        </div>
      </form>
    </section>
  </main>

  <script>
    // Mailto form handler
    (function(){
      const form = document.getElementById('contactForm');
      const status = document.getElementById('formStatus');
      if(!form) return;
      form.addEventListener('submit', (e)=>{
        e.preventDefault();
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const subject = document.getElementById('subject').value;
        const message = document.getElementById('message').value;
        
        const mailtoLink = `mailto:robbiahsadiq@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(`From: ${name} (${email})\n\n${message}`)}`;
        window.location.href = mailtoLink;
        status.textContent = 'Opening email client...';
      });

      // Copy-address button: useful when you would rather paste it somewhere
      // else than hand off to a mail client.
      const copyBtn = document.getElementById('copyEmail');
      if (copyBtn) {
        copyBtn.addEventListener('click', async () => {
          const address = copyBtn.dataset.email;
          const done = () => {
            const original = copyBtn.textContent;
            copyBtn.textContent = 'Copied ✓';
            if (status) status.textContent = address;
            setTimeout(() => { copyBtn.textContent = original; }, 1800);
          };
          try {
            await navigator.clipboard.writeText(address);
            done();
          } catch (err) {
            // Clipboard API needs a secure context; fall back to selection.
            const tmp = document.createElement('textarea');
            tmp.value = address;
            document.body.appendChild(tmp);
            tmp.select();
            try { document.execCommand('copy'); done(); }
            catch (e2) { if (status) status.textContent = address; }
            tmp.remove();
          }
        });
      }
    })();
  </script>
