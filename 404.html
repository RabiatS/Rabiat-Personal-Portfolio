<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="top">
  <p class="eyebrow">Error 404</p>
  <h1>This page <span>fell off the website.</span></h1>
  <p class="lead">There is nothing at <code id="path">this address</code>. Maybe it moved, maybe it never existed, maybe the earthquake got it.</p>
  <div class="btns">
    <a class="p" href="/">Take me home</a>
    <a href="/projects.html">Projects</a>
    <a href="/lab/">Lab</a>
    <a href="/lab/study/">Study Lab</a>
  </div>
  <p class="hint" id="hint">Grab the pieces and throw them</p>
</div>

<script>
(function () {
  'use strict';
  try { var f = JSON.parse(localStorage.getItem('eggs:found') || '[]'); if (f.indexOf('lost') < 0) { f.push('lost'); localStorage.setItem('eggs:found', JSON.stringify(f)); } } catch (e) { /* private window */ }
  try { document.getElementById('path').textContent = decodeURIComponent(location.pathname); } catch (e) { /* keep default */ }
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Stars
  var sc = document.getElementById('stars'); var sg = sc.getContext('2d'); var stars = [];
  function fitStars() {
    var d = Math.min(2, devicePixelRatio || 1); sc.width = innerWidth * d; sc.height = innerHeight * d; sg.setTransform(d, 0, 0, d, 0, 0);
    stars = []; for (var i = 0; i < Math.round(innerWidth * innerHeight / 5200); i++) stars.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 1.2 + .2, p: Math.random() * 6 });
  }
  function drawStars(t) {
    sg.clearRect(0, 0, innerWidth, innerHeight);
    for (var i = 0; i < stars.length; i++) { var s = stars[i]; sg.globalAlpha = reduce ? .6 : .35 + .35 * Math.sin(t / 900 + s.p); sg.fillStyle = '#fff'; sg.beginPath(); sg.arc(s.x, s.y, s.r, 0, 7); sg.fill(); }
  }
  fitStars(); addEventListener('resize', fitStars);

  // Pieces
  var vw = innerWidth; var vh = innerHeight; var big = Math.max(90, Math.min(240, vw * 0.2));
  var defs = [
    { html: '4', cls: 'digit', style: 'font-size:' + big + 'px' },
    { html: '0', cls: 'digit', style: 'font-size:' + big + 'px' },
    { html: '4', cls: 'digit', style: 'font-size:' + big + 'px' },
    { html: '<span class="eye l"></span><span class="eye r"></span>', cls: 'visor' },
    { html: 'Home', cls: 'chip grad' }, { html: 'Projects', cls: 'chip' }, { html: 'Coursework', cls: 'chip' }, { html: 'Lab', cls: 'chip' },
    { html: 'Cool', cls: 'chip' }, { html: 'Contact', cls: 'chip' }, { html: 'Professional mad scientist.', cls: 'chip' },
    { html: '<i></i><b>A missing page</b><s></s><s></s>', cls: 'card' },
    { html: 'Applied ML', cls: 'chip' }, { html: 'XR', cls: 'chip' }, { html: 'HCI Research', cls: 'chip' },
  ];
  var pieces = defs.map(function (d, i) {
    var el = document.createElement('div'); el.className = 'piece ' + d.cls; el.innerHTML = d.html; el.setAttribute('aria-hidden', 'true');
    if (d.style) el.setAttribute('style', d.style);
    document.body.appendChild(el);
    var r = el.getBoundingClientRect();
    var o = { el: el, w: r.width, h: r.height, i: i, oy: 0, gh: r.height };
    if (d.cls === 'digit') {
      // Measure the real glyph, since the line box is taller than the digit itself
      var cs = getComputedStyle(el); var cv = document.createElement('canvas').getContext('2d');
      cv.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
      var mt = cv.measureText(d.html);
      var fa = mt.fontBoundingBoxAscent, fd = mt.fontBoundingBoxDescent;
      if (fa != null && fd != null && mt.actualBoundingBoxAscent != null) {
        var base = (r.height - (fa + fd)) / 2 + fa;
        var top = base - mt.actualBoundingBoxAscent; var bottom = base + mt.actualBoundingBoxDescent;
        o.gh = Math.max(10, bottom - top); o.oy = (top + bottom) / 2 - r.height / 2;
      } else { o.gh = r.height * .74; }
    }
    return o;
  });

  function staticLayout() {
    // No physics (reduced motion, or the library could not load): lay the pieces on the floor
    var x = 16; var row = vh - 12; var rowH = 0;
    pieces.slice().sort(function (a, b) { return b.h - a.h; }).forEach(function (p) {
      if (x + p.w > vw - 16) { x = 16; row -= rowH + 8; rowH = 0; }
      p.el.style.transform = 'translate(' + x + 'px,' + (row - p.h) + 'px)';
      x += p.w + 10; rowH = Math.max(rowH, p.h);
    });
    document.getElementById('hint').textContent = '';
  }

  function loop(t) { drawStars(t); requestAnimationFrame(loop); }
  if (reduce) { drawStars(0); staticLayout(); return; }
  requestAnimationFrame(loop);

  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js';
  s.onerror = staticLayout;
  s.onload = function () { physics(window.Matter); };
  document.head.appendChild(s);

  function physics(M) {
    var E = M.Engine, B = M.Bodies, Bd = M.Body, C = M.Composite;
    var engine = E.create(); engine.gravity.y = 1.6;
    var T = 300;
    var floor = B.rectangle(vw / 2, vh - 14 + T / 2, vw * 4, T, { isStatic: true, friction: .9 });
    var left = B.rectangle(-T / 2, vh / 2, T, vh * 6, { isStatic: true });
    var right = B.rectangle(vw + T / 2, vh / 2, T, vh * 6, { isStatic: true });
    C.add(engine.world, [floor, left, right]);
    pieces.forEach(function (p, n) {
      var digit = p.el.classList.contains('digit');
      var w = digit ? p.w * .84 : p.w; var h = digit ? p.gh : p.h;
      var x = digit ? vw / 2 + (p.i - 1) * big * .78 : 40 + Math.random() * (vw - 80);
      p.body = B.rectangle(x, -h - n * 70 - Math.random() * 60, w, h, { chamfer: { radius: Math.min(h / 2, digit ? 10 : 22) }, restitution: digit ? .25 : .35, friction: .6, density: digit ? .004 : .0015 });
      Bd.setAngularVelocity(p.body, (Math.random() - .5) * .12);
      C.add(engine.world, p.body);
    });
    var mouse = M.Mouse.create(document.body); mouse.pixelRatio = 1;
    // Let the real links and buttons keep working: only grab when the pointer is on a piece
    document.body.removeEventListener('wheel', mouse.mousewheel);
    var mc = M.MouseConstraint.create(engine, { mouse: mouse, constraint: { stiffness: .25, render: { visible: false } } });
    C.add(engine.world, mc);
    var last = performance.now(); var acc = 0;
    function step(now) {
      acc = Math.min(acc + (now - last), 1000 / 15); last = now;
      while (acc >= 1000 / 60) { E.update(engine, 1000 / 60); acc -= 1000 / 60; }
      for (var i = 0; i < pieces.length; i++) {
        var p = pieces[i]; var b = p.body;
        p.el.style.transformOrigin = '50% ' + (50 + p.oy / p.h * 100).toFixed(2) + '%';
        p.el.style.transform = 'translate(' + (b.position.x - p.w / 2).toFixed(1) + 'px,' + (b.position.y - p.h / 2 - p.oy).toFixed(1) + 'px) rotate(' + b.angle.toFixed(3) + 'rad)';
      }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
    // Tap the empty sky for a little aftershock
    addEventListener('dblclick', function () { pieces.forEach(function (p) { Bd.setVelocity(p.body, { x: (Math.random() - .5) * 18, y: -10 - Math.random() * 14 }); }); });
    document.getElementById('hint').textContent = 'Grab the pieces and throw them. Double click for an aftershock.';
    addEventListener('resize', function () { location.reload(); });
  }
})();
</script>
