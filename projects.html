  <!-- Prevent theme flash & minimalist Rabiat -->
  <script>
    (function(){
      var g = localStorage.getItem('glassLevel');
      var legacy = { clear: 0, 'default': 50, frosted: 100 };
      var t = (g in legacy ? legacy[g] : parseInt(g, 10));
      if (!isFinite(t)) t = 0;
      t = Math.min(100, Math.max(0, t)) / 100;
      var st = document.documentElement.style;
      st.setProperty('--glass-blur', (40 * Math.pow(t, 3.75)).toFixed(2) + 'px');
      st.setProperty('--glass-saturate', (1.05 + t * 1.05).toFixed(3));
      st.setProperty('--glass-alpha-boost', (-0.055 + t * 0.2).toFixed(4));
      st.setProperty('--glass-lens', (1 - t).toFixed(3));
      var plain = localStorage.getItem('plainMode') === 'true';
      var rabiat = localStorage.getItem('plainModeVariant') === 'rabiat';
      if (plain && rabiat) {
        document.documentElement.classList.add('plain-mode', 'plain-mode--rabiat', 'dark');
        document.documentElement.style.colorScheme = 'dark';
        return;
      }
      if (plain) {
        document.documentElement.classList.add('plain-mode');
        document.documentElement.style.colorScheme = 'light';
        return;
      }
      var saved = localStorage.getItem('theme');
      var dark = !saved || saved === 'dark';
      if (dark) { document.documentElement.classList.add('dark'); document.documentElement.style.colorScheme='dark'; }
    })();
  </script>
